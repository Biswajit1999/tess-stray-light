name: TESS mask-policy research validation
on:
  push:
    branches: ['research/**']
  pull_request:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pytest==8.2.2 matplotlib==3.9.0
      - run: python -m pytest -q tests/test_policy_robustness.py
      - run: python scripts/run_policy_robustness.py
      - uses: actions/upload-artifact@v4
        with:
          name: tess-mask-policy-synthetic-diagnostics
          path: |
            reports/policy-robustness-synthetic.json
            reports/policy-robustness-synthetic.png
